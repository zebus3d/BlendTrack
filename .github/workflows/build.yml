name: build

# Se ejecuta en cada push a main, al empujar una etiqueta de version, o a mano
# desde Actions.
#
# En main se actualiza UN UNICO pre-release (siempre el mismo, con el tag de
# la version final a la que aspira): cada push reconstruye los tres binarios y
# reemplaza los assets de ese pre-release. Promoverlo (promote.yml) lo convierte
# en release final sin reconstruir nada. Con un tag vX.Y.Z, en cambio, se crea
# una release final directamente.
#
# El auto-update de la app consulta `.../releases/latest`, que IGNORA los
# pre-releases: mientras iteres, nadie recibe nada.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

# Un solo build por ref a la vez. Sin esto, dos push seguidos lanzan dos runs
# concurrentes que mueven el MISMO tag del pre-release y uno falla con
# "failed to push some refs". Al llegar un push nuevo se cancela el anterior
# (solo interesa el ultimo commit); el run cancelado se puede descartar sin
# problema porque el nuevo rehace los binarios y reemplaza los assets.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos para todos los jobs: leer el repo. Solo el que publica la
# release (``release``) pide escribir, en su propio bloque. Sin esto, los jobs
# de compilar (que ejecutan pip y PyInstaller, código de terceros) heredaban
# los permisos por defecto del token, que pueden ser de escritura.
permissions:
  contents: read

jobs:
  # Calcula la version que se inyecta en los binarios y el tag de la release.
  #
  # OJO con esto: la version va COCIDA en el binario (inject_version.py la
  # escribe en src/version.py antes de compilar). Por eso las iteraciones de
  # main comparten version con la release final a la que aspiran (p. ej.
  # v1.3.0): promover solo le quita la marca de pre-release, no reetiqueta nada.
  # Si la promocion cambiara la version, la app se actualizaria en bucle (ver
  # AGENTS.md -> "Por que no reetiquetar binarios ya subidos").
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      name: ${{ steps.compute.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calcular version
        id: compute
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            NAME="v${VERSION}"
          else
            # Base: la ultima release FINAL (la API ignora los pre-releases) y
            # subimos la minor. Asi todo el ciclo comparte version y el
            # pre-release es siempre el mismo hasta que se promueve.
            BASE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
                      --jq .tag_name 2>/dev/null || true)"
            if [[ -z "${BASE}" || "${BASE}" == "null" ]]; then
              BASE="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)"
            fi
            MAJOR="$(echo "$BASE" | sed -E 's/^v?([0-9]+).*/\1/')"
            MINOR="$(echo "$BASE" | sed -E 's/^v?[0-9]+\.([0-9]+).*/\1/')"
            VERSION="${MAJOR}.$((MINOR + 1)).0"
            NAME="v${VERSION} (build ${GITHUB_RUN_NUMBER})"
          fi
          # Defensa en profundidad: la versión acaba en nombres de fichero y
          # en órdenes de los otros jobs, así que solo se admite X.Y.Z.
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versión no válida: ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

  # Pruebas unitarias. Las de UI corren con el plugin offscreen de Qt, asi que
  # no hace falta servidor grafico (pero si PySide6 y sus libs de sistema).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias del sistema (Qt en modo offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libgl1 libegl1
      - name: Dependencias de Python
        run: python -m pip install -r requirements-dev.txt
      # Imports sin usar, nombres sin definir, cierres que capturan la
      # variable del bucle... La configuración está en pyproject.toml.
      - name: Lint (ruff)
        run: ruff check src tests packaging
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -t . -s tests -v

  # Qt Widgets renderiza con el motor *raster* (CPU): sin OpenGL, el mismo
  # AppImage funciona en cualquier distro. Se compila en Ubuntu 22.04
  # (glibc 2.35, cubre Ubuntu 22.04+/Debian 12+/Mint 21-22/Fedora 36+/Arch) y
  # PySide6 solo pide glibc 2.34, asi que el techo de glibc es el del Python.
  #
  # Lo unico que hay que vigilar es el plugin de plataforma xcb de Qt: sus
  # dependencias (libxcb-icccm4 y compania) tienen que estar en el runner para
  # que PyInstaller las bundlee; si no, el AppImage no abre en el equipo del
  # usuario ("could not load the Qt platform plugin xcb").
  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inyectar version
        shell: bash
        # La versión pasa por el entorno, no interpolada en el script: es el
        # patrón que recomienda GitHub contra la inyección de órdenes.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python packaging/inject_version.py "$VERSION"
      - name: Dependencias del sistema (plugin xcb de Qt)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libglib2.0-0 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Compilar binario portable y AppImage
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          pyinstaller --clean --noconfirm packaging/blendtrack.spec --distpath dist --workpath build
          packaging/build_appimage.sh dist
          # Copiamos el AppImage a la raíz para que el artefacto contenga
          # únicamente el archivo, sin la carpeta dist/.
          cp dist/BlendTrack-x86_64.AppImage BlendTrack-x86_64.AppImage
          # Puente de compatibilidad temporal: quien ya tenga instalado el
          # antiguo BlenderManager busca su asset por el nombre viejo
          # (updater.ASSET_NAMES en su copia). Publicamos también una copia con
          # ese nombre (mismo binario, solo cambia el fichero) para que su
          # auto-update le instale esta version. En Linux no importa el nombre
          # interno de la AppImage: al aplicarla se reemplaza el fichero en su
          # sitio. Quitar cuando no queden instalaciones antiguas.
          cp BlendTrack-x86_64.AppImage BlenderManager-x86_64.AppImage
      - name: Smoke test del AppImage generado
        run: |
          chmod +x BlendTrack-x86_64.AppImage
          # ``--smoke`` sale con 2 si el servidor de Blender esta caido (5xx o
          # HTML en vez de JSON): eso no es culpa del binario, asi que se sigue.
          # Cualquier otro codigo distinto de 0 si bloquea.
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 ./BlendTrack-x86_64.AppImage --smoke
          smoke=$?
          set -e
          if [ "$smoke" = "2" ]; then
            echo "::warning::El servidor de Blender no da el listado; se publica igual."
          elif [ "$smoke" != "0" ]; then
            exit "$smoke"
          fi
          # Y ademas la GUI: --smoke no importa Qt, asi que por si solo no pilla
          # que falte shiboken6 (ya paso: el binario no arrancaba y el smoke
          # pasaba). El plugin offscreen monta la ventana sin pantalla.
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen ./BlendTrack-x86_64.AppImage --screenshot /tmp/shot.png
          test "$(stat -c%s /tmp/shot.png)" -gt 5000
      - name: Comprobar que el AppImage lleva el icono dentro
        run: |
          ./BlendTrack-x86_64.AppImage --appimage-extract >/dev/null
          # .DirIcon es lo que ensena el gestor de ficheros para el fichero
          # suelto, y appimagetool saca el resto del Icon= del .desktop.
          test -s squashfs-root/.DirIcon
          grep -q "^Icon=blendtrack$" squashfs-root/blendtrack.desktop
          rm -rf squashfs-root
      - uses: actions/upload-artifact@v4
        with:
          name: BlendTrack-linux
          path: |
            BlendTrack-x86_64.AppImage
            BlenderManager-x86_64.AppImage

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # En los `if` no se pueden usar secretos. Antes el token se exponía como
      # `env` a TODO el job (pip y PyInstaller incluidos, código de terceros);
      # ahora solo lo ve este paso, que publica si existe, y el de firmar.
      - name: Comprobar si hay SignPath
        id: signpath
        shell: bash
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inyectar version
        shell: bash
        # La versión pasa por el entorno, no interpolada en el script: es el
        # patrón que recomienda GitHub contra la inyección de órdenes.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python packaging/inject_version.py "$VERSION"
      - name: Compilar binario portable
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          pyinstaller --clean --noconfirm packaging/blendtrack.spec --distpath dist --workpath build
      # Firma con SignPath (gratis para open source). La accion firma a partir
      # de un artifact de GitHub, no de un fichero local, asi que hay que subir
      # el .exe sin firmar antes. Sin el secreto SIGNPATH_API_TOKEN todo esto se
      # salta y el .exe queda sin firmar (o con la autofirmada de abajo).
      - name: Subir el .exe sin firmar (para SignPath)
        id: unsigned
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BlendTrack-windows-unsigned
          path: dist/BlendTrack.exe
          # Sin zip: asi SignPath recibe el .exe tal cual.
          archive: false
          retention-days: 1
      - name: Firmar con SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # El artifact no es un zip (archive: false): no descomprimir.
          skip-decompress: true
          output-artifact-directory: dist
      # Plan B: firma autofirmada, copiada de hurricane_solver, SOLO si no hay
      # SignPath. NO evita el aviso de SmartScreen (no lo avala una CA) y cada
      # build genera un certificado distinto, asi que no da reputacion; pero
      # malware rara vez va firmado y puede suavizar heuristicos. Best-effort:
      # si el runner no deja firmar, el release sigue con el .exe sin firmar.
      - name: Firmar el ejecutable (autofirmado, sin SignPath)
        if: steps.signpath.outputs.enabled != 'true'
        continue-on-error: true
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=BlendTrack" -CertStoreLocation Cert:\CurrentUser\My
          Set-AuthenticodeSignature -FilePath dist\BlendTrack.exe -Certificate $cert
          Get-AuthenticodeSignature dist\BlendTrack.exe | Format-List
      - name: Empaquetar el .exe
        run: |
          # En Windows el spec genera onefile: un unico BlendTrack.exe, sin
          # carpeta _internal que el usuario pueda borrar por error.
          Compress-Archive -Path dist/BlendTrack.exe -DestinationPath BlendTrack-windows-x86_64.zip
      # Puente de compatibilidad temporal (el mismo que el AppImage del job
      # linux): quien tenga el antiguo BlenderManager (<= v1.62) busca su asset
      # por el nombre viejo, y en Windows ademas el updater de esa copia busca
      # BlenderManager.exe DENTRO del zip para lanzarlo como ayudante. Se
      # publica una copia con el .exe renombrado; el binario es el mismo (ya
      # lleva la version nueva dentro). Quitar cuando no queden instalaciones
      # antiguas.
      - name: Empaquetar la copia de compatibilidad (nombre antiguo)
        run: |
          Copy-Item dist/BlendTrack.exe dist/BlenderManager.exe
          Compress-Archive -Path dist/BlenderManager.exe -DestinationPath BlenderManager-windows-x86_64.zip
      # Que el .exe arranque de verdad. Sin esto, un Windows roto se descubre
      # cuando lo baja un usuario: no tenemos ninguna maquina Windows a mano.
      - name: Comprobar que el binario arranca (GUI incluida)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # 2 = el servidor de Blender esta caido (no es culpa del binario).
          set +e
          ./dist/BlendTrack.exe --smoke
          smoke=$?
          set -e
          if [ "$smoke" = "2" ]; then
            echo "::warning::El servidor de Blender no da el listado; se publica igual."
          elif [ "$smoke" != "0" ]; then
            exit "$smoke"
          fi
          ./dist/BlendTrack.exe --screenshot shot.png
          ls -l shot.png
          test "$(stat -c%s shot.png)" -gt 5000
      - uses: actions/upload-artifact@v4
        with:
          name: BlendTrack-windows
          path: |
            BlendTrack-windows-x86_64.zip
            BlenderManager-windows-x86_64.zip

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inyectar version
        shell: bash
        # La versión pasa por el entorno, no interpolada en el script: es el
        # patrón que recomienda GitHub contra la inyección de órdenes.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python packaging/inject_version.py "$VERSION"
      - name: Compilar bundle .app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          pyinstaller --clean --noconfirm packaging/blendtrack.spec --distpath dist --workpath build
          cd dist && zip -r ../BlendTrack-macos.zip BlendTrack.app
      # Que el bundle arranque de verdad, GUI incluida (ver el job windows).
      - name: Comprobar que el bundle arranca (GUI incluida)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # 2 = el servidor de Blender esta caido (no es culpa del binario).
          set +e
          ./dist/BlendTrack.app/Contents/MacOS/BlendTrack --smoke
          smoke=$?
          set -e
          if [ "$smoke" = "2" ]; then
            echo "::warning::El servidor de Blender no da el listado; se publica igual."
          elif [ "$smoke" != "0" ]; then
            exit "$smoke"
          fi
          ./dist/BlendTrack.app/Contents/MacOS/BlendTrack --screenshot shot.png
          ls -l shot.png
          test "$(stat -f%z shot.png)" -gt 5000
      # El .app tiene que llevar el .icns y declararlo en el Info.plist, o
      # Finder ensena el icono generico. PlistBuddy falla si falta la clave.
      - name: Comprobar que el bundle lleva el icono
        run: |
          ICNS="$(find dist/BlendTrack.app -name '*.icns' | head -1)"
          test -n "${ICNS}"
          test -s "${ICNS}"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" dist/BlendTrack.app/Contents/Info.plist
      # Puente de compatibilidad temporal (ver el job windows): quien tenga el
      # antiguo BlenderManager (<= v1.62) busca BlenderManager-macos.zip y,
      # dentro, un .app cuyo ejecutable se llame BlenderManager. Se publica una
      # copia del mismo bundle con el nombre viejo; hay que renombrar tambien
      # la clave CFBundleExecutable del Info.plist o `open` no encuentra con
      # que abrirlo. Quitar cuando no queden instalaciones antiguas.
      - name: Empaquetar la copia de compatibilidad (nombre antiguo)
        run: |
          /usr/bin/ditto dist/BlendTrack.app dist/BlenderManager.app
          mv dist/BlenderManager.app/Contents/MacOS/BlendTrack \
             dist/BlenderManager.app/Contents/MacOS/BlenderManager
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable BlenderManager" \
            dist/BlenderManager.app/Contents/Info.plist
          cd dist && zip -r ../BlenderManager-macos.zip BlenderManager.app
      - uses: actions/upload-artifact@v4
        with:
          name: BlendTrack-macos
          path: |
            BlendTrack-macos.zip
            BlenderManager-macos.zip

  # Publica la release con los binarios adjuntos.
  #
  # - Push a main: actualiza el UNICO pre-release (mismo tag, mismos nombres
  #   de asset, asi que se reemplazan). Mientras iteras, nadie recibe nada: el
  #   auto-update mira `releases/latest`, que ignora los pre-releases.
  # - Tag vX.Y.Z: release final de una vez.
  # - workflow_dispatch en otra rama: NO publica; deja los binarios como
  #   artefactos del run, para probar sin que salga en Releases.
  release:
    needs: [version, test, linux, windows, macos]
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Generar checksums SHA-256
        working-directory: release-assets
        run: |
          find . -type f -not -name checksums.txt -print0 \
            | sort -z | xargs -0 sha256sum > checksums.txt
          cat checksums.txt
      # El tag del pre-release tiene que apuntar siempre a lo ultimo compilado
      # (si no, `git describe` en un checkout da una version vieja y los
      # commits de mas). El push va con el GITHUB_TOKEN: los eventos que lanza
      # ese token NO disparan workflows, asi que esto no vuelve a entrar por el
      # `on: push: tags`.
      - name: Mover el tag del pre-release
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          git tag -f "$TAG" "$GITHUB_SHA"
          # -f permite el non-fast-forward (el tag se mueve a proposito). El
          # reintento cubre una carrera puntual con otro run o con promote: el
          # tag es un ref compartido y dos updates a la vez pueden chocar.
          for intento in 1 2 3; do
            if git push -f origin "refs/tags/${TAG}"; then
              exit 0
            fi
            echo "push del tag fallo (intento ${intento}); reintentando..."
            sleep 5
          done
          exit 1
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.name }}
          prerelease: ${{ github.ref == 'refs/heads/main' }}
          make_latest: ${{ github.ref != 'refs/heads/main' }}
          generate_release_notes: ${{ github.ref != 'refs/heads/main' }}
          overwrite_files: true
          files: release-assets/**/*
